[workspace]
members = ["crates/lade-core", "crates/lade-protocol", "crates/lade-system", "crates/lade-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0-imp001"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
lade-core = { path = "crates/lade-core" }
lade-protocol = { path = "crates/lade-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
gtk4 = { version = "=0.11.4", default-features = false, features = ["v4_14"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0
