name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify-and-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Native build and sandbox prerequisites (disposable runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev build-essential pkg-config bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap (disposable runner only)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / --proc /proc --dev /dev true
      - run: ./scripts/bootstrap-rust
      - run: npm --prefix packages/pi-worker ci --ignore-scripts --no-audit --no-fund
      - run: ./scripts/verify
      - name: Throwaway signing key (this runner only; the release key and trust bootstrap are pending)
        run: |
          mkdir -m 700 "$RUNNER_TEMP/keys"
          ssh-keygen -q -t ed25519 -N '' -C ci -f "$RUNNER_TEMP/keys/ci"
          printf 'ci@lade namespaces="lade-release" %s\n' "$(cat "$RUNNER_TEMP/keys/ci.pub")" >"$RUNNER_TEMP/keys/allowed"
          chmod 600 "$RUNNER_TEMP/keys/allowed"
      - name: Release bundle (bundled Node runtime, signed with the throwaway key)
        run: ./scripts/bundle --with-node "$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")" --sign "$RUNNER_TEMP/keys/ci"
      - name: Install, verify the signature, rollback and uninstall the real bundle in a disposable HOME
        run: ./scripts/test-install --bundle dist/lade-0.2.0 --allowed-signers "$RUNNER_TEMP/keys/allowed"
